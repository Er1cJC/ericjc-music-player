server:
  port: 18080

spring:
  config:
    import: optional:file:./config/local.yml
  application:
    name: ericjc-music-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/music_player?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:musicplayer}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

app:
  upload-dir: uploads
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
